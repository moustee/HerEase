<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#fdf5f9;--cd:#fff;--ink:#2a1a26;--mut:#7a6473;--pri:#8d4778;--pr2:#a8527f;--on:#fff;--p2:#f8e8f0;--acc:#d6336c;--a2:#fde7ef;--ln:#efdde7;--ok:#1b774a;--ok2:#e4f4ea;--wn:#80530a;--w2:#fff3d9;--g1:#6d2f5c;--g2:#a8527f;--sh:0 8px 24px rgba(141,71,120,.10);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#160e15;--cd:#231522;--ink:#f8ebf2;--mut:#c9adc0;--pri:#f08cbc;--pr2:#ff9cc6;--on:#2a0f20;--p2:#3a2034;--acc:#ff7aa8;--a2:#3d1f2e;--ln:#3a2537;--ok:#6fd49c;--ok2:#17331f;--wn:#f0c56a;--w2:#372f17;--g1:#4a1f40;--g2:#8a3a69;--sh:0 8px 24px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#160e15;--cd:#231522;--ink:#f8ebf2;--mut:#c9adc0;--pri:#f08cbc;--pr2:#ff9cc6;--on:#2a0f20;--p2:#3a2034;--acc:#ff7aa8;--a2:#3d1f2e;--ln:#3a2537;--ok:#6fd49c;--ok2:#17331f;--wn:#f0c56a;--w2:#372f17;--g1:#4a1f40;--g2:#8a3a69;--sh:0 8px 24px rgba(0,0,0,.35)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 420px at 90% -80px,rgba(214,51,108,.10),transparent 70%),radial-gradient(700px 380px at -10% 0,rgba(141,71,120,.12),transparent 70%),var(--bg);background-attachment:fixed;color:var(--ink);font:16px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);display:flex;align-items:center;gap:8px;padding:12px 0}

.fld{display:grid;gap:6px;margin:12px 0}.fld label{font-weight:650;font-size:14px}
input,select,textarea{width:100%;min-height:48px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--ln);background:var(--cd)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 4px rgba(141,71,120,.16)}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.due{background:var(--a2);border:2px solid var(--acc);border-radius:20px;padding:16px;margin:4px 0 12px;animation:pulse 2.4s infinite}
.wk{display:flex;gap:6px;margin-top:14px}.wk div{flex:1;text-align:center;font-size:12px;color:var(--mut)}

.wk i.s{background:var(--w2);color:var(--wn)}.wk i.n{background:transparent;border:1.5px dashed var(--ln);color:var(--mut)}
.sw{width:52px;height:30px;border-radius:99px;border:0;background:var(--ln);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:linear-gradient(135deg,var(--pri),var(--pr2))}.sw.on::after{left:25px}
.tb{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:496px;display:flex;background:var(--cd);background:color-mix(in srgb,var(--cd) 86%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--ln);border-radius:28px;padding:6px;box-shadow:0 16px 36px rgba(80,30,70,.25);z-index:20}
.tb button{flex:1;border:0;background:none;display:grid;gap:2px;justify-items:center;font-size:12px;color:var(--mut);min-height:52px}
.tb button.on{color:var(--pri);font-weight:800}.tb span{font-size:20px;padding:2px 18px;border-radius:99px}.tb button.on span{background:linear-gradient(135deg,var(--pri),var(--pr2));color:var(--on)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal b{text-align:center;font-size:12px;color:var(--mut)}
.cd{aspect-ratio:1;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;font-size:15px;position:relative}
.cd.t{box-shadow:inset 0 0 0 2px var(--pri)}.cd.sel{background:linear-gradient(135deg,var(--pri),var(--pr2));color:var(--on)}.cd.sel u i{background:var(--on)}
.cd u{position:absolute;bottom:4px;display:flex;gap:3px;text-decoration:none}.cd u i{width:6px;height:6px;border-radius:50%;background:var(--acc)}.cd u i.k{background:var(--ok)}.cd u i.g{background:var(--mut)}
.li{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--ln)}.li:last-child{border:0}.li>div{flex:1}.li small{display:block;color:var(--mut)}
.sb{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fi .2s}
.sc{background:var(--cd);width:100%;max-width:520px;max-height:90%;overflow:auto;border-radius:24px 24px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px));animation:up .32s cubic-bezier(.2,.8,.2,1)}
.sc::before{content:"";display:block;width:44px;height:5px;border-radius:9px;background:var(--ln);margin:-10px auto 14px}
.ts{position:fixed;left:50%;bottom:calc(98px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;padding:12px 16px;border-radius:14px;font-size:14px;max-width:90%;z-index:60;opacity:0;pointer-events:none;transition:.2s;box-shadow:0 10px 28px rgba(80,30,70,.35)}.ts.on{opacity:1}
.ov{position:fixed;inset:0;background:var(--bg);z-index:50;overflow:auto;padding:calc(24px + env(safe-area-inset-top,0px)) 20px 24px}.ov>div{max-width:520px;margin:0 auto}
.pv{background:#2b1a27;color:#fff;border-radius:16px;padding:12px 14px;font-size:15px}.pv small{opacity:.7;display:block}
.pg{height:6px;background:var(--p2);border-radius:9px;overflow:hidden;margin:6px 0}.pg i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--pr2))}
.hero{position:relative;overflow:hidden;border-radius:26px;padding:24px 22px;margin:6px 0 4px;color:#fff;background:linear-gradient(135deg,var(--g1),var(--g2));background-size:200% 200%;animation:sheen 12s ease-in-out infinite alternate;box-shadow:0 14px 34px rgba(109,47,92,.30)}
.hero h2{font-size:28px;line-height:1.15;margin:10px 0 4px}.hero p{margin:0;opacity:.92}
.hero small{display:inline-block;font-weight:700;font-size:12px;padding:4px 12px;border-radius:99px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.28)}
.hero .fl{position:absolute;right:-6px;top:-34px;font-size:150px;line-height:1;opacity:.12;animation:spin 60s linear infinite}
.hero.sm{padding:18px 20px;margin:0 0 4px}.hero.sm h2{font-size:22px;margin:8px 0 2px}.hero.sm .fl{font-size:110px;top:-24px}
.hero.big{padding:36px 24px}.hero.big h2{font-size:42px}
.nx{display:inline-block;margin-top:12px;padding:6px 14px;border-radius:99px;background:rgba(255,255,255,.2);font-weight:700;font-size:14px}
.ic{display:grid;place-items:center;flex:none;width:52px;height:52px;border-radius:17px;background:var(--p2);font-size:28px}
.ic.big{width:64px;height:64px;border-radius:20px;font-size:34px;background:linear-gradient(135deg,var(--g1),var(--g2))}
.stp{display:flex;gap:6px;margin:4px 0 6px}.stp i{height:6px;flex:1;border-radius:9px;background:var(--ln)}.stp i.on{background:linear-gradient(90deg,var(--pri),var(--pr2))}
.vp{list-style:none;margin:18px 0;padding:0;display:grid;gap:14px}.vp li{display:flex;gap:14px;align-items:center}.vp small{display:block;color:var(--mut)}.vp .ic{width:48px;height:48px;font-size:24px}
.lib-s{position:relative;margin-top:14px}.lib-s input{padding-left:46px;border-radius:16px}.lib-s::before{content:"🔍";position:absolute;left:16px;top:13px;font-size:18px;z-index:1}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.cat{position:relative;overflow:hidden;text-align:left;border:0;border-radius:22px;padding:16px;min-height:138px;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:0 12px 26px rgba(80,30,70,.22);transition:transform .12s}
.cat span{position:absolute;right:12px;top:10px;font-size:46px;line-height:1}.cat b{font-size:16px;line-height:1.2}.cat small{opacity:.92;font-size:12px;margin-top:3px}
.eh{display:flex;gap:12px;align-items:center;color:#fff;border-radius:18px;padding:16px;margin-bottom:8px}.eh span{font-size:36px}.eh small{display:block;opacity:.92}.eh b{font-size:19px;line-height:1.2}
.sh{margin:16px 0 2px;color:var(--pri);font-size:13px;text-transform:uppercase;letter-spacing:.05em}.sh+p{margin:0 0 4px}
.blob{position:fixed;z-index:-1;width:340px;height:340px;border-radius:50%;filter:blur(70px);opacity:.42;pointer-events:none;animation:drift 16s ease-in-out infinite alternate}.b1{top:-90px;right:-110px;background:#f472b6}.b2{bottom:12%;left:-150px;background:#a78bfa;animation-delay:-6s}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .blob{opacity:.2}}:root[data-theme="dark"] .blob{opacity:.2}
#spl{position:fixed;inset:0;z-index:100;display:grid;place-content:center;justify-items:center;gap:10px;text-align:center;background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;animation:fo .5s .8s forwards}
#spl .lg{width:76px;height:76px;border-radius:24px;font-size:40px;background:rgba(255,255,255,.18);box-shadow:none;animation:pop .6s cubic-bezier(.2,1.4,.4,1) both}#spl b{font-size:34px;letter-spacing:-.03em}#spl i{font-style:normal;opacity:.8;font-weight:500}#spl small{opacity:.85}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(214,51,108,.35)}50%{box-shadow:0 0 0 10px rgba(214,51,108,0)}}
@keyframes drift{to{transform:translate(40px,60px) scale(1.15)}}@keyframes sheen{to{background-position:100% 100%}}@keyframes spin{to{transform:rotate(360deg)}}
@keyframes up{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}@keyframes fi{from{opacity:0}}@keyframes fo{to{opacity:0;visibility:hidden}}@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
#view.an>*{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}#view.an>*:nth-child(2){animation-delay:.07s}#view.an>*:nth-child(3){animation-delay:.14s}#view.an>*:nth-child(n+4){animation-delay:.2s}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<i class="blob b1"></i><i class="blob b2"></i>
<div id="spl"><span class="lg" aria-hidden="true">✿</span><b>Her<i>Ease</i></b><small>Private family planning companion</small></div>
<div class="app"><header><h1 class="brand"><span class="lg" aria-hidden="true">✿</span>Her<i>Ease</i></h1>
<span id="off" class="chip" hidden>Offline · Library ready</span>
<button class="ib" aria-label="Demo guide" onclick="go('guide')">?</button>
<button class="ib" aria-label="Settings" onclick="go('set')">⚙</button>
<button class="ib" aria-label="Hide screen" onclick="hide()">◐</button></header>
<div id="bn"></div><main id="view"></main></div>
<nav class="tb"><button data-t="home" onclick="go('home')"><span>⌂</span>Home</button><button data-t="plan" onclick="go('plan')"><span>♡</span>Plan</button><button data-t="cal" onclick="go('cal')"><span>▦</span>Calendar</button><button data-t="learn" onclick="go('learn')"><span>▤</span>Library</button><button data-t="care" onclick="go('care')"><span>⌖</span>Care</button></nav>
<div id="sh"></div><div id="ov"></div><div class="ts" id="ts" role="status" aria-live="polite"></div>
<script>
const K='herease_v1',$=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0');
const D={ob:0,lang:'en',tab:'home',m:null,rem:{on:1,t:'08:00',pv:1},log:{},z:{},ev:[],cp:{},pin:'',done:{},sn:null,dis:{},th:'auto'};
function load(){const s=JSON.parse(JSON.stringify(D));try{Object.assign(s,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){}return s}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
let S=load(),dr=null,os=0,ack=false,ul=!S.pin,sel='',q='',fl='',dk='',lc='',lq='',cm=new Date(new Date().getFullYear(),new Date().getMonth(),1);
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),today=()=>ymd(new Date());
const t12=t=>{const p=t.split(':'),h=+p[0];return(h%12||12)+':'+p[1]+(h<12?' AM':' PM')};
const fd=s=>new Date(s+'T00:00').toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
const addD=(s,n)=>{const d=new Date(s+'T00:00');d.setDate(d.getDate()+n);return ymd(d)};
const dd=(a,b)=>Math.round((new Date(a+'T00:00')-new Date(b+'T00:00'))/864e5);
const rel=s=>{const n=dd(s,today());return n===0?'Today':n===1?'Tomorrow':n===-1?'Yesterday':n>1?'In '+n+' days':-n+' days ago'};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mk=k=>{if(!S.done[k]){S.done[k]=1;save()}};
const M={pill:['💊','Daily pill','Taken every day'],inj:['💉','Injection','Given by a provider'],imp:['🩹','Implant','Placed under the skin'],iud:['♡','IUD','Placed in the womb'],oth:['＋','Other methods','Condoms, natural methods and more']};
const SR={prov:['Confirmed by my provider','ok'],leaf:['From my product leaflet','ok'],own:['My own note, not confirmed','wn']};
const OT=['Condoms','Fertility awareness','Emergency contraception','Permanent method','Breastfeeding (LAM)','Not sure yet'];
const KT={a:'Appointment',r:'Reminder',u:'Added by you',c:'Record'};
function toast(m){const e=$('#ts');e.textContent=m;e.className='ts on';clearTimeout(toast.t);toast.t=setTimeout(()=>e.className='ts',3200)}
function sheet(h){$('#sh').innerHTML='<div class="sb" onclick="if(event.target===this)shut()"><div class="sc" role="dialog" aria-modal="true">'+h+'</div></div>'}
const shut=()=>{$('#sh').innerHTML=''};
const gr=c=>`linear-gradient(135deg,${c[3][0]},${c[3][1]})`;
const hero=(a,b,c)=>`<div class="hero sm"><span class="fl" aria-hidden="true">✿</span><small>${a}</small><h2>${b}</h2><p>${c}</p></div>`;
const an=()=>{const v=$('#view');v.classList.remove('an');void v.offsetWidth;v.classList.add('an');setTimeout(()=>v.classList.remove('an'),700)};
/* ---------- events, completion, doses ---------- */
function evs(){const r=S.ev.map(e=>({...e,k:'u'})),m=S.m;
 if(m){const a=(i,t,d,k)=>d&&r.push({id:i+d,title:t,date:d,time:'',k});
  if(m.t==='pill')a('p','Refill or check-up',m.d1,'r');
  if(m.t==='inj')a('i','Injection appointment',m.d1,'a');
  if(m.t==='imp'||m.t==='iud'){a('s',M[m.t][1]+' inserted',m.d0,'c');a('f','Provider follow-up',m.d1,'a')}
  if(m.t==='oth')a('o',m.rt||'Reminder',m.d1,'r')}
 return r.sort((x,y)=>(x.date+x.time).localeCompare(y.date+y.time))}
const mid=()=>{const m=S.m;return m&&m.d1?{pill:'p',inj:'i',imp:'f',iud:'f',oth:'o'}[m.t]+m.d1:''};
function erow(e){const c=S.cp[e.id],od=!c&&e.date<today()&&e.k!=='c';return `<div class="li"><div><b>${esc(e.title)}</b><small>${rel(e.date)} · ${fd(e.date)}${e.time?' · '+t12(e.time):''}</small><span class="tag ${c?'ok':od?'wn':''}">${c?'Completed':od?'Overdue':KT[e.k]}</span></div>${e.k==='c'?'':c?`<button class="btn" onclick="undo('${e.id}')">Undo</button>`:`<button class="btn" onclick="done('${e.id}')">Done</button>`}${e.k==='u'?`<button class="btn" aria-label="Remove" onclick="delEv('${e.id}')">✕</button>`:''}</div>`}
function done(id){const e=evs().find(x=>x.id===id);if(!e)return;S.cp[id]={t:e.title,d:e.date,at:today()};save();mk('dn');banner();render();
 if('if'.includes(id[0]))sheet(`<h3>Marked as completed</h3><p>Ask your provider for your next date and add it in your plan. We never work it out for you.</p><div class="row"><button class="btn pri" onclick="shut();go('plan')">Update my next date</button><button class="btn" onclick="shut()">Later</button></div>`);else toast('Marked as completed.')}
function undo(id){delete S.cp[id];save();banner();render()}
function delEv(id){S.ev=S.ev.filter(e=>e.id!==id);save();render()}
function dose(d,s){if(s)S.log[d]=s;else delete S.log[d];save();mk('dn');banner();render();toast(s==='taken'?'Dose marked as taken. This is your own record.':s==='skipped'?'Marked as skipped.':'Entry cleared.')}
function upc(){const T=today(),E=evs().filter(e=>e.k!=='c'&&!S.cp[e.id]);return E.filter(e=>e.date<T).concat(E.filter(e=>e.date>=T).slice(0,5))}
function recs(){const r=[];for(const d in S.log)r.push({d:d,t:'Pill '+S.log[d],ok:S.log[d]==='taken'});for(const k in S.cp)r.push({d:S.cp[k].d,t:'Completed: '+S.cp[k].t,ok:1});r.sort((a,b)=>b.d.localeCompare(a.d));return r.slice(0,10).map(x=>`<div class="li"><span class="tag ${x.ok?'ok':'wn'}">${x.ok?'✓':'–'}</span><div><b>${esc(x.t)}</b><small>${fd(x.d)}</small></div></div>`).join('')||'<p class="mut">No records yet. Marked doses and completed visits appear here.</p>'}

['p','🌱','Pregnancy & fertility',['#6a2f9a','#9448b8'],[

['Antenatal care','Check-ups during pregnancy','What it is|Regular visits help find and manage problems early and prepare you for birth.','Seek urgent care for|Heavy bleeding, severe headache, blurred vision, severe belly pain, fever, convulsions, fluid leaking, or your baby moving much less.'],
['Pregnancy loss','Miscarriage and support','What it is|Miscarriage is the loss of a pregnancy early on. It is common and is rarely caused by anything you did.','Seek urgent care for|Heavy bleeding, severe pain, fever or fainting. It is normal to grieve, and support is available.'],
['Difficulty getting pregnant','Fertility problems and help','What it is|Many couples conceive within a year of trying. If not, or sooner if you are older or have a known condition, a provider can check both partners.','Good to know|Causes can involve either partner, and testing and treatment exist. Be careful with unproven remedies and unlicensed sellers.']

['b','🍼','After birth & feeding',['#a8325e','#c23b66'],[
['Family planning after birth','Plan before you leave the clinic','What it is|Fertility can return soon after birth, sometimes before your first period.','Good to know|Different methods suit different times after delivery, especially while breastfeeding. Ask at antenatal visits and baby check-ups.','Ask your provider|Which methods can I start now, and which should I wait for?'],

['s','🛡️','Sexual health & infections',['#3d3a8c','#5b4fc2'],[

['r','🤝','Consent, safety & support',['#8f2f10','#c2521e'],[

const lrow=(c,i)=>{const e=c[4][i];return `<div class="li"><span class="ic" style="background:${gr(c)}">${c[1]}</span><div><b>${e[0]}</b><small>${e[1]}</small></div><button class="btn" onclick='topic("${c[0]}",${i})'>Read</button></div>`};

 const r=[];LIB.forEach(c=>c[4].forEach((e,i)=>{if(e.join(' ').toLowerCase().includes(k))r.push(lrow(c,i))}));
 return `<div class="card">${r.join('')||'<p class="mut">No topics found. Try another word.</p>'}</div>`}
const lr=()=>{$('#lr').innerHTML=lres()};
const libNote=()=>`<div class="note"><b>Draft library, v1.</b> Drafted from WHO family planning guidance, and saved inside the app so it opens without internet. It must be reviewed by qualified Nigerian reproductive-health professionals and checked against national protocols before public release.</div>`;
function vLearn(){
 if(lc){const c=LIB.find(x=>x[0]===lc);return `<button class="btn" onclick='lc="";render();an()'>← All topics</button><div class="hero sm" style="background:${gr(c)};margin-top:12px"><span class="fl" aria-hidden="true">${c[1]}</span><small>${c[4].length} topic${c[4].length>1?'s':''}</small><h2>${c[2]}</h2></div><div class="card">${c[4].map((e,i)=>lrow(c,i)).join('')}</div>${libNote()}`}
 return hero('Saved on this device','Health Library','Trusted family planning and reproductive health information. Opens without internet.')+`<div class="lib-s"><input id="lq" type="search" value="${esc(lq)}" placeholder="Search, e.g. implant, side effects" aria-label="Search the Health Library" oninput="lq=this.value;lr()"></div><div id="lr">${lres()}</div>${libNote()}`}
function topic(cid,i){mk('ed');const c=LIB.find(x=>x[0]===cid),e=c[4][i];sheet(`<div class="eh" style="background:${gr(c)}"><span aria-hidden="true">${c[1]}</span><div><small>${c[2]}</small><b>${e[0]}</b></div></div>${e.slice(2).map(s=>{const p=s.split('|');return`<h4 class="sh">${HI[p[0]]?HI[p[0]]+' ':''}${p[0]}</h4><p>${p[1]}</p>`}).join('')}<div class="note"><b>Draft for clinical review.</b> General information, not medical advice. If something feels urgent, seek care now.</div><div class="row"><button class="btn pri" onclick='shut();go("care")'>Find care</button><button class="btn" onclick="shut()">Close</button></div>`)}

const C=[['Demo Family Health Centre','Ikeja, Lagos','pill inj imp'],['Demo Women’s Wellness Clinic','Yaba, Lagos','pill inj imp iud'],['Demo Community Health Service','Surulere, Lagos','pill inj'],['Demo Mother & Child Clinic','Garki, Abuja','pill inj imp iud'],['Demo Primary Health Centre','Nasarawa, Kano','pill inj imp'],['Demo Family Care Unit','GRA, Port Harcourt','pill inj iud']],FC={pill:'Pills',inj:'Injections',imp:'Implants',iud:'IUDs'};

/* ---------- Settings, privacy, data ---------- */
const th0=document.documentElement.getAttribute('data-theme');

function wipe(){try{localStorage.removeItem(K)}catch(e){}S=load();dr=null;os=0;ack=false;ul=true;dk='';shut();$('#ov').innerHTML='';start();toast('All data deleted.')}

<div class="card"><h3>Language</h3><select aria-label="Language" onchange="S.lang=this.value;save();render()"><option value="en"${S.lang==='en'?' selected':''}>English</option><option value="ha"${S.lang==='ha'?' selected':''}>Hausa (planned)</option></select>${S.lang==='ha'?'<p class="mut" style="margin-top:8px">Hausa is part of the plan. HerEase will keep showing English until translated content has been reviewed.</p>':''}</div>
<div class="card"><h3>App lock</h3><p class="mut">${S.pin?'A PIN is set. You’ll be asked for it when the app opens or after you use the hide button.':'Ask for a 4-digit PIN when the app opens.'}</p><div class="row"><button class="btn" onclick="pinUI()">${S.pin?'Change PIN':'Set a PIN'}</button>${S.pin?'<button class="btn" onclick="rmPin()">Remove PIN</button>':''}</div><p class="mut" style="margin-top:10px">Prototype-grade: it covers the screen but does not encrypt data.</p></div>
<div class="card"><h3>Your information</h3><p class="mut">Everything stays in this browser. Please don’t enter real medical details in this demo.</p><div class="row"><button class="btn" onclick="exp()">View my data</button><button class="btn" onclick="wipeUI()">Delete all my data</button></div></div>`;
function hide(){$('#ov').innerHTML='<div class="ov" style="background:#fff;color:#111" onclick="back()"><div><h2 style="margin:0 0 6px">Notes</h2><p style="color:#666">No notes yet.</p><p style="color:#999;margin-top:40vh;font-size:13px">Tap anywhere to return</p></div></div>'}
function back(){$('#ov').innerHTML='';if(S.pin){ul=false;lock()}else if(!S.ob)onb()}
function lock(){if(S.pin&&!ul){$('#ov').innerHTML=`<div class="ov"><div><h2 class="h">HerEase</h2><p class="mut">Enter your PIN to continue.</p><div class="fld"><input id="lp" type="password" inputmode="numeric" maxlength="4" autocomplete="off" aria-label="PIN" onkeydown="if(event.key==='Enter')unl()"></div><button class="btn pri blk" onclick="unl()">Unlock</button><p class="mut" style="margin-top:18px">Forgot your PIN?</p><button class="btn" onclick="wipe()">Erase data and reset</button></div></div>`;return true}return false}
function unl(){if($('#lp').value===S.pin){ul=true;$('#ov').innerHTML='';start()}else toast('That PIN doesn’t match.')}
/* ---------- Demo guide ---------- */
const G=[['ov','See your Home page','home'],['sv','Choose a method and save your plan','plan'],['rm','Change reminder time or lock-screen wording','plan'],['dn','Mark a dose taken or a visit completed','cal'],['cal','Open the Calendar and its records','cal'],['ed','Open a Health Library topic','learn'],['cl','Search or filter Find care','care']];
function vGuide(){const n=G.filter(g=>S.done[g[0]]).length;return hero('Demo guide','Try every feature','Steps tick off as you go.')+`<div class="card"><h3>Guided tour</h3><p class="mut">${n} of 7 steps done.</p><div class="pg"><i style="width:${n/7*100}%"></i></div>${G.map(g=>`<div class="li"><span class="tag ${S.done[g[0]]?'ok':''}">${S.done[g[0]]?'Done':'To do'}</span><div>${g[1]}</div><button class="btn" onclick="go('${g[2]}')">Go</button></div>`).join('')}<button class="btn blk" style="margin-top:12px" onclick="demo()">Fire a demo reminder now</button><p class="mut" style="margin-top:8px">Needs “Daily pill” saved with reminders on. It clears today’s log entry so you can try Taken, Snooze and Skip.</p></div>
<div class="card"><h3>What works in this prototype</h3><ul><li>Welcome, language and method set-up, with a schedule that fits each method.</li><li>Your plan, doses, appointments and settings are saved in this browser.</li><li>Mark doses as taken and appointments as completed, today or in the past.</li><li>The Health Library is built into the page, so it opens without internet once the app has loaded.</li><li>PIN screen cover, data view and delete all work.</li></ul><h3>What is still simulated</h3><ul><li>Hausa. It is planned, so the app stays in English for now.</li><li>No background notifications, SMS or WhatsApp.</li><li>No account, server, encryption or sync.</li><li>No clinical rules. Dates are only what you or a provider enter.</li><li>Clinics are fictional, and the library is a draft awaiting clinical review.</li></ul></div>`}

 const L=(k,n,s,t)=>`<button class="mo ${S.lang===k?'on':''}" aria-pressed="${S.lang===k}" onclick="S.lang='${k}';save();onb()"><b style="font-size:18px">${n}</b><small>${s}</small>${t?` <span class="tag wn" style="font-size:11px">${t}</span>`:''}</button>`;
 let h='';
 if(os===0)h=`<div class="hero big"><span class="fl" aria-hidden="true">✿</span><small>Welcome</small><h2>HerEase</h2><p>Your private family planning companion.</p></div><ul class="vp"><li><span class="ic">💗</span><div><b>You choose your method</b><small>We never recommend or prescribe one.</small></div></li><li><span class="ic">⏰</span><div><b>Gentle, private reminders</b><small>Discreet wording by default.</small></div></li><li><span class="ic">📚</span><div><b>A Health Library that works offline</b><small>Trusted information, saved on your phone.</small></div></li></ul><button class="btn pri blk" onclick="os=1;onb()">Get started</button><p class="mut" style="margin-top:12px;text-align:center">Demo prototype. Not a medical device.</p>`;
 if(os===1)h=`<h2 class="h">Choose your language</h2><p class="mut">You can change this later in Settings.</p><div class="mg" style="grid-template-columns:1fr;margin:14px 0">${L('en','English','Available now','')}${L('ha','Hausa','Harshen Hausa','Planned')}</div>${S.lang==='ha'?`<div class="note">Hausa is part of our plan. It will arrive once the content has been translated and checked by qualified reviewers. For now, HerEase will continue in English.</div>`:''}<label class="row" style="margin:16px 0;flex-wrap:nowrap"><input id="ck" type="checkbox" style="width:26px;height:26px;min-height:26px;flex:none" ${ack?'checked':''} onchange="ack=this.checked;$('#nx').disabled=!ack"><span>I understand this is a demo and I won’t enter real medical details.</span></label><div class="row"><button class="btn" onclick="os=0;onb()">Back</button><button id="nx" class="btn pri" style="flex:1" ${ack?'':'disabled'} onclick="os=2;onb()">Continue</button></div>`;

 if(os===3)h=`${stp(2)}<h2 class="h">Set up your ${dr&&dr.t==='pill'?'daily reminder':dr&&dr.t==='oth'?'reminder':'follow-up dates'}</h2><p class="mut">Only add dates that you or your provider have confirmed.</p><div id="mf">${mDet()}</div><div class="card"><h3>Reminders</h3>${rForm()}</div><div class="row"><button class="btn" onclick="os=2;onb()">Back</button><button class="btn pri" style="flex:1" onclick="if(saveM()){S.ob=1;save();onb();banner();go('home');toast('You’re all set. Welcome to HerEase.')}">Finish and go to Home</button></div>`;
 o.innerHTML='<div class="ov"><div>'+h+'</div></div>'}
